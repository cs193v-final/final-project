name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:            # lets us turn on a merge queue later

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Superseded PR runs are cancelled; runs on main always finish, so every
  # merge commit gets a completed secret scan.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GITLEAKS_VERSION: 8.30.1
  # sha256 of gitleaks_8.30.1_linux_x64.tar.gz; update together with the version.
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  secrets:
    name: Secret scan + hook tests (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0          # needed for the history scan below
          persist-credentials: false
      - run: scripts/install-gitleaks.sh
      - name: Secret scan
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            # Only this PR's commits, so an old rotated secret on main can't block PRs.
            gitleaks git --redact --no-banner --verbose --config .gitleaks.toml \
              --log-opts="origin/$BASE_REF..HEAD"
          else
            # Full history on main and in the merge queue. Rotated secrets still in
            # history go in .gitleaksignore (see README).
            gitleaks git --redact --no-banner --verbose --config .gitleaks.toml
          fi
      - name: Hook tests
        run: scripts/test-hooks.sh

  shellcheck:
    name: Shell lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: shellcheck .githooks/* scripts/*.sh

  app:
    name: App checks (lint, typecheck, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # The Next.js app lives at the repo root and uses npm with a committed
      # package-lock.json (needed by `cache: npm` and `npm ci`).
      - name: Detect app
        id: detect
        run: |
          if [ -f package.json ]; then echo "present=true" >> "$GITHUB_OUTPUT"
          else echo "No package.json yet; skipping app checks."; fi
      - if: steps.detect.outputs.present == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - if: steps.detect.outputs.present == 'true'
        run: npm ci
      - if: steps.detect.outputs.present == 'true'
        run: npm run lint --if-present
      - if: steps.detect.outputs.present == 'true'
        run: npm run typecheck --if-present
      - if: steps.detect.outputs.present == 'true'
        run: npm test --if-present
      - if: steps.detect.outputs.present == 'true'
        run: npm run build --if-present

  e2e:
    name: End-to-end tests (Playwright)
    runs-on: ubuntu-latest
    # /play keeps games in Postgres (#54). A throwaway Postgres on the runner,
    # reached over localhost, so the app uses node-postgres (src/db/index.ts)
    # without TLS. No password: trust auth on a container that only lives for
    # this job (and no credential-looking URL for the secret scan).
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: zoomout
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres@localhost:5432/zoomout
      DATABASE_URL_UNPOOLED: postgresql://postgres@localhost:5432/zoomout
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The app encrypts usernames with DATA_ENCRYPTION_KEY (#84), as on every
      # real tier. A fresh random key for this job only, so no key is ever in
      # the repo; it's masked in the logs and gone when the job ends.
      - name: Make a throwaway encryption key
        run: |
          key="$(openssl rand -base64 32)"
          echo "::add-mask::$key"
          echo "DATA_ENCRYPTION_KEY=$key" >> "$GITHUB_ENV"
      # Only Chromium: both projects (desktop and phone) use it. The version
      # matches @playwright/test in package.json.
      - run: npx playwright install --with-deps chromium
      # playwright.config.ts starts `next start` on the build when CI is set.
      - run: npm run build
      # Creates the tables in the service container (drizzle-kit uses `pg`).
      - run: npm run db:migrate
      # Loads the practice pack and its puzzles (#52), as on every real
      # database. /play would also work without it (it inserts the pack row).
      - run: npm run db:seed
      - run: npm run test:e2e
      - name: Upload the report and traces
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
